name: Deploy to Beget

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы сайта
        uses: actions/checkout@v4

      - name: Настроить SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.BEGET_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts

      - name: Загрузить сайт на Beget
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:/home/t/tiukhl2z/tiukhl2z.beget.tech/public_html/"
